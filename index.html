<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>海陸空大作戰：核平世界版</title>
    <style>
        /* 全局禁止選取與長按 */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body { margin: 0; overflow: hidden; background: #000; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; touch-action: none; color: white; }
        canvas { display: block; background: linear-gradient(#1a2a6c, #b21f1f, #fdbb2d); }
        
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; width: 100%; z-index: 5; }
        .hp-bar-container { width: 100px; height: 10px; background: #333; border: 2px solid #fff; margin-bottom: 5px; border-radius: 5px; overflow: hidden; }
        .hp-fill { height: 100%; width: 100%; background: lime; transition: width 0.2s; }
        .boss-hp-container { width: 80%; height: 15px; background: #222; border: 2px solid gold; margin: 5px auto; position: relative; }
        .boss-hp-fill { height: 100%; width: 100%; background: linear-gradient(to right, #ff0000, #ff8c00); }
        
        /* 核彈按鈕 */
        .nuke-btn { 
            position: absolute; 
            bottom: 150px; 
            width: 70px;
            height: 70px; 
            background: rgba(255, 69, 0, 0.7); 
            border: 3px solid gold; 
            border-radius: 50%; 
            font-size: 35px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 100; 
            box-shadow: 0 0 15px #ff4500; 
            pointer-events: auto; 
            transition: transform 0.1s;
        }
        .nuke-btn:active { transform: scale(0.9); background: rgba(255, 255, 0, 0.8); }

        #nuke-p1 { left: 20px; }
        #nuke-p2 { right: 20px; }
        .nuke-count { position: absolute; top: -5px; right: -5px; background: gold; color: black; border-radius: 50%; width: 25px; height: 25px; font-size: 16px; font-weight: bold; display: flex; align-items: center; justify-content: center; }

        #flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 1000; }
        
        /* 彈窗樣式 */
        .modal { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 500; 
            text-align: center; 
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .btn-continue, .btn-next-level {
            padding: 20px 40px;
            font-size: 24px;
            background: linear-gradient(to bottom, #32CD32, #228B22);
            color: white;
            border: 3px solid #fff;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 0 20px #32CD32;
            margin: 20px;
            cursor: pointer;
            text-shadow: 1px 1px 2px black;
        }
        
        .btn-restart {
            position: absolute; 
            bottom: 30px;
            padding: 10px 20px;
            font-size: 14px;
            background: #444; 
            color: #aaa;
            border: 1px solid #666;
            border-radius: 10px;
            cursor: pointer;
        }

        .victory-title {
            font-size: 45px;
            color: gold;
            text-shadow: 0 0 10px orange, 0 0 20px red;
            margin-bottom: 10px;
            font-weight: 900;
            letter-spacing: 2px;
        }
        
        .victory-desc {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 30px;
            line-height: 1.5;
        }

    </style>
</head>
<body oncontextmenu="return false;">

<div id="flash"></div>

<div id="ui">
    <div style="display:flex; justify-content: space-around;">
        <div>戰機1 (紅): <div class="hp-bar-container"><div id="p1-hp" class="hp-fill"></div></div></div>
        <div>戰機2 (藍): <div class="hp-bar-container"><div id="p2-hp" class="hp-fill"></div></div></div>
    </div>
    <div style="text-align: center;">
        <div id="level-name" style="font-weight:bold; color:gold;">第一關：深海巨鯊 🦈</div>
        <div class="boss-hp-container"><div id="boss-hp" class="boss-hp-fill"></div></div>
    </div>
</div>

<div id="nuke-p1" class="nuke-btn" onclick="useNuke()">☢️<div class="nuke-count" id="nuke-val">3</div></div>
<div id="nuke-p2" class="nuke-btn" onclick="useNuke()">☢️</div>

<div id="overlay" class="modal">
    <h1 style="color: red; font-size: 50px; text-shadow: 0 0 20px red;">💥 戰機墜毀 💥</h1>
    <button class="btn-continue" onclick="continueGame()">🚀 立即接關 (原地復活)</button>
    <button class="btn-restart" onclick="location.reload()">↺ 放棄掙扎，重新開始</button>
</div>

<div id="level-clear" class="modal">
    <div class="victory-title">⚠️ 目標殲滅 ⚠️</div>
    <div class="victory-desc">
        核彈洗地完成，威脅已清除。<br>
        引擎冷卻完畢，準備前往下一戰區！
    </div>
    <button class="btn-next-level" onclick="nextLevel()">前進下一關 >></button>
</div>

<div id="award" class="modal">
    <h1 style="color:gold; font-size:40px; text-shadow: 0 0 20px gold;">🏆 世界和平 🏆</h1>
    <div id="award-text" style="font-size:18px; margin:20px; line-height:1.6;"></div>
    <button class="btn-continue" onclick="location.reload()">受封為傳奇英雄 (重來)</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
// 禁止右鍵與長按選單
window.addEventListener('contextmenu', function (e) { e.preventDefault(); }, { passive: false });

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const levelData = [
    { name: "第一關：深海巨鯊 🦈", emoji: "🦈", hp: 1200, attackRate: 1800 },
    { name: "第二關：荒漠巨蠍 🦂", emoji: "🦂", hp: 2500, attackRate: 1600 },
    { name: "第三關：鋼鐵巨龍 🐉", emoji: "🐉", hp: 4500, attackRate: 1300 },
    { name: "第四關：外星戰艦 🛸", emoji: "🛸", hp: 7000, attackRate: 1100 },
    { name: "第五關：終極機甲 🤖", emoji: "🤖", hp: 10000, attackRate: 800 }
];

let currentLevel = 0;
let gameOver = false;
let gameWin = false;
let isPaused = false;
let nukeCount = 3;
let screenShake = 0;
let animationId = null; // ★ 關鍵修正：用來管理動畫ID，防止重複加速

let bullets = [], enemyBullets = [], items = [];

class Fighter {
    constructor(x, y, color) {
        this.x = x; this.y = y; this.w = 50; this.h = 40;
        this.color = color; this.hp = 100;
        this.weaponLevel = 1; this.buffTimer = 0;
        this.touchId = null; // 用來綁定手指 ID
    }
    draw() {
        if (this.hp <= 0) return;
        ctx.fillStyle = this.buffTimer > 0 ? "white" : this.color;
        ctx.beginPath();
        ctx.moveTo(this.x + 25, this.y);
        ctx.lineTo(this.x, this.y + 40); 
        ctx.lineTo(this.x + 50, this.y + 40);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "orange"; ctx.fillRect(this.x + 15, this.y + 40, 20, 10 + Math.random()*10);
    }
}

class Item {
    constructor() {
        this.x = Math.random() * (canvas.width - 40) + 20;
        this.y = -50;
        let r = Math.random();
        this.type = r > 0.6 ? 'health' : (r > 0.3 ? 'power' : 'nuke'); 
        this.dy = 3; this.w = 40; this.h = 40;
    }
    draw() {
        ctx.font = "35px Arial";
        ctx.textAlign = "center";
        let icon = "❤️";
        if(this.type === 'power') icon = "⚡";
        if(this.type === 'nuke') icon = "☢️";
        ctx.fillText(icon, this.x, this.y);
    }
    update() { this.y += this.dy; }
}

let p1 = new Fighter(canvas.width/4, 500, "#FF3131");
let p2 = new Fighter(3*canvas.width/4, 500, "#318CE7");
let boss = null;

class Boss {
    constructor(config) {
        this.maxHp = config.hp; this.hp = config.hp;
        this.emoji = config.emoji;
        this.x = canvas.width/2; this.y = canvas.height - 120;
        this.speed = 2 + currentLevel * 0.7;
        this.dir = 1; this.lastAttack = 0;
    }
    update() {
        this.x += this.speed * this.dir;
        if (this.x < 50 || this.x > canvas.width - 50) this.dir *= -1;
        if (Date.now() - this.lastAttack > levelData[currentLevel].attackRate) {
            this.shoot(); this.lastAttack = Date.now();
        }
    }
    shoot() {
        let count = 3 + currentLevel;
        for(let i = -Math.floor(count/2); i <= Math.floor(count/2); i++) {
            enemyBullets.push({x: this.x, y: this.y, dx: i * 2, dy: -4 - currentLevel*0.4});
        }
    }
    draw() {
        ctx.font = "90px Arial";
        ctx.textAlign = "center";
        ctx.fillText(this.emoji, this.x, this.y + 30);
    }
}

function initLevel() {
    gameOver = false;
    isPaused = false;
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('level-clear').style.display = 'none';
    
    const config = levelData[currentLevel];
    document.getElementById('level-name').innerText = config.name;
    boss = new Boss(config);
    bullets = []; enemyBullets = []; items = [];
    p1.hp = 100; p2.hp = 100;
    p1.touchId = null; 
    p2.touchId = null;
}

function useNuke() {
    if (nukeCount <= 0 || gameOver || gameWin || isPaused) return;
    nukeCount--;
    document.getElementById('nuke-val').innerText = nukeCount;
    document.getElementById('flash').style.opacity = 1;
    setTimeout(() => document.getElementById('flash').style.opacity = 0, 200);
    screenShake = 30;
    enemyBullets = [];
    boss.hp -= boss.maxHp * 0.2; 
    if (boss.hp < 0) boss.hp = 0;
}

setInterval(() => {
    if (!gameOver && !gameWin && !isPaused) items.push(new Item());
}, 4500);

setInterval(() => {
    if (gameOver || gameWin || isPaused) return;
    [p1, p2].forEach(p => {
        if (p.hp > 0) {
            if (p.weaponLevel === 3) {
                bullets.push({x: p.x+25, y: p.y+40, dx: -1.5, dy: 10});
                bullets.push({x: p.x+25, y: p.y+40, dx: 0, dy: 11});
                bullets.push({x: p.x+25, y: p.y+40, dx: 1.5, dy: 10});
            } else {
                bullets.push({x: p.x+25, y: p.y+40, dx: 0, dy: 11});
            }
        }
    });
}, 300);

// ★ 核心修復：啟動遊戲迴圈的函數
function startGameLoop() {
    // 1. 如果已經有在跑的迴圈，先強制取消它
    if (animationId) {
        cancelAnimationFrame(animationId);
    }
    // 2. 啟動新的迴圈
    loop();
}

function loop() {
    // 如果遊戲狀態是停止的，就不請求下一幀，確保迴圈真的「停下」
    if (gameOver || gameWin || isPaused) {
        animationId = null;
        return; 
    }
    
    let offsetX = 0, offsetY = 0;
    if (screenShake > 0) {
        offsetX = Math.random() * screenShake - screenShake/2;
        offsetY = Math.random() * screenShake - screenShake/2;
        screenShake *= 0.9;
    }
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(offsetX, offsetY);

    boss.update(); boss.draw();
    p1.draw(); p2.draw();

    items.forEach((it, i) => {
        it.update(); it.draw();
        [p1, p2].forEach(p => {
            if (p.hp > 0 && Math.abs(it.x - (p.x+25)) < 35 && Math.abs(it.y - (p.y+20)) < 35) {
                if (it.type === 'health') p.hp = Math.min(100, p.hp + 45);
                else if (it.type === 'power') { p.weaponLevel = 3; p.buffTimer = 350; }
                else if (it.type === 'nuke') { 
                    nukeCount = Math.min(5, nukeCount + 1); 
                    document.getElementById('nuke-val').innerText = nukeCount;
                }
                items.splice(i, 1);
            }
        });
        if (it.y > canvas.height) items.splice(i, 1);
    });

    bullets.forEach((b, i) => {
        b.y += b.dy; b.x += b.dx;
        ctx.fillStyle = "yellow"; ctx.fillRect(b.x-2, b.y, 5, 18);
        if (Math.abs(b.x - boss.x) < 55 && Math.abs(b.y - boss.y) < 55) {
            boss.hp -= 30; bullets.splice(i, 1);
        }
    });

    enemyBullets.forEach((eb, i) => {
        eb.x += eb.dx; eb.y += eb.dy;
        ctx.fillStyle = "cyan"; ctx.beginPath(); ctx.arc(eb.x, eb.y, 7, 0, Math.PI*2); ctx.fill();
        [p1, p2].forEach(p => {
            if (p.hp > 0 && Math.abs(eb.x - (p.x+25)) < 25 && Math.abs(eb.y - (p.y+20)) < 25) {
                p.hp -= 20; enemyBullets.splice(i, 1);
            }
        });
    });

    ctx.restore();

    document.getElementById('p1-hp').style.width = p1.hp + "%";
    document.getElementById('p2-hp').style.width = p2.hp + "%";
    document.getElementById('boss-hp').style.width = (boss.hp / boss.maxHp * 100) + "%";

    if (boss.hp <= 0) {
        if (currentLevel < 4) { 
            isPaused = true;
            document.getElementById('level-clear').style.display = 'flex';
        } 
        else { showAward(); }
    }
    if (p1.hp <= 0 && p2.hp <= 0) { gameOver = true; document.getElementById('overlay').style.display = 'flex'; }

    [p1, p2].forEach(p => { if(p.buffTimer > 0) { p.buffTimer--; if(p.buffTimer <= 0) p.weaponLevel = 1; } });

    // 請求下一幀，並將 ID 存起來
    animationId = requestAnimationFrame(loop);
}

// 切換下一關
function nextLevel() {
    currentLevel++;
    initLevel(); 
    startGameLoop(); // 使用安全啟動函數
}

// 接關
function continueGame() { 
    initLevel(); 
    startGameLoop(); // 使用安全啟動函數
}

function showAward() {
    gameWin = true;
    document.getElementById('award').style.display = 'flex';
    document.getElementById('award-text').innerHTML = `
        你就是終極的戰場主宰！<br>
        憑藉著精準的走位與毀滅性的核彈技術，<br>
        你單槍匹馬（或與隊友）橫掃了海陸空五大禁區！<br>
        魔王們在你的火光中化為塵埃。<br>
        現在，你是這片天空最閃耀的傳奇機師！
    `;
}

// -----------------------------------------------------------
// 觸控控制邏輯：自動判斷最近的飛機，不限區域
// -----------------------------------------------------------

function getDistance(touch, fighter) {
    return Math.sqrt(Math.pow(touch.clientX - (fighter.x + 25), 2) + Math.pow(touch.clientY - (fighter.y + 20), 2));
}

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        let t = e.changedTouches[i];
        let dist1 = getDistance(t, p1);
        let dist2 = getDistance(t, p2);

        // 如果手指點下去，看離哪台飛機近，就取得該飛機控制權
        if (p1.touchId === null && (dist1 <= dist2 || p2.touchId !== null)) {
            p1.touchId = t.identifier;
            p1.x = t.clientX - 25; 
            p1.y = Math.min(t.clientY - 20, canvas.height); 
        } else if (p2.touchId === null) {
            p2.touchId = t.identifier;
            p2.x = t.clientX - 25; 
            p2.y = Math.min(t.clientY - 20, canvas.height); 
        }
    }
}, {passive: false});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        let t = e.changedTouches[i];
        if (t.identifier === p1.touchId) {
            p1.x = t.clientX - 25; 
            p1.y = Math.min(t.clientY - 20, canvas.height); 
        }
        if (t.identifier === p2.touchId) {
            p2.x = t.clientX - 25; 
            p2.y = Math.min(t.clientY - 20, canvas.height); 
        }
    }
}, {passive: false});

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        let t = e.changedTouches[i];
        if (t.identifier === p1.touchId) p1.touchId = null;
        if (t.identifier === p2.touchId) p2.touchId = null;
    }
}, {passive: false});

// 第一次啟動
initLevel(); 
startGameLoop();
</script>
</body>
</html>
