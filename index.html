<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>海陸空大作戰 - 進階版</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Arial', sans-serif; touch-action: none; }
        canvas { display: block; background: linear-gradient(#87CEEB 0%, #87CEEB 60%, #4682B4 60%, #00008B 100%); }
        #ui { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 2px 2px 4px #000; pointer-events: none; font-size: 14px; }
        #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: gold; font-size: 24px; text-align: center; display: none; background: rgba(0,0,0,0.8); padding: 30px; border-radius: 15px; border: 2px solid gold; z-index: 10; }
        .hp-bar { width: 100px; height: 10px; background: #555; display: inline-block; border: 1px solid #fff; }
        .hp-inner { height: 100%; background: lime; }
    </style>
</head>
<body>

<div id="ui">
    <div>戰機1: <div class="hp-bar"><div id="p1-hp-bar" class="hp-inner"></div></div> <span id="p1-status"></span></div>
    <div>戰機2: <div class="hp-bar"><div id="p2-hp-bar" class="hp-inner"></div></div> <span id="p2-status"></span></div>
    <div style="margin-top:5px;">鯊魚 BOSS: <div class="hp-bar" style="width:150px;"><div id="boss-hp-bar" class="hp-inner" style="background:red;"></div></div></div>
    <div>擊毀數: <span id="score">0</span></div>
</div>

<div id="msg" onclick="location.reload()">遊戲結束<br><span style="font-size:16px">點擊螢幕重新挑戰</span></div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gameOver = false;
let score = 0;

// 遊戲對象陣列
let bullets = [];
let enemyBullets = [];
let items = [];
let minions = [];
let tanks = [];

// 玩家類別
class Plane {
    constructor(x, y, color, id) {
        this.x = x; this.y = y; this.w = 40; this.h = 30;
        this.color = color; this.id = id;
        this.hp = 100; this.maxHp = 100;
        this.fireRate = 500; // 毫秒
        this.lastFire = 0;
        this.weaponType = 'normal'; // normal, triple
        this.buffTimer = 0;
    }
    draw() {
        if (this.hp <= 0) return;
        ctx.fillStyle = this.buffTimer > 0 ? 'white' : this.color;
        ctx.fillRect(this.x, this.y, this.w, this.h);
        ctx.fillStyle = 'black';
        ctx.fillRect(this.x + 10, this.y - 5, 20, 5); // 機艙
    }
    update(nx, ny) {
        if (this.hp <= 0) return;
        this.x = nx - this.w/2;
        this.y = ny - this.h/2;
        if (this.y > canvas.height * 0.55) this.y = canvas.height * 0.55; // 限制飛行高度
        
        if (this.buffTimer > 0) {
            this.buffTimer--;
            if (this.buffTimer <= 0) {
                this.weaponType = 'normal';
                this.fireRate = 500;
            }
        }
    }
    shoot() {
        const now = Date.now();
        if (now - this.lastFire > this.fireRate) {
            if (this.weaponType === 'triple') {
                bullets.push(new Bullet(this.x + 20, this.y + 30, 8, -2, 'yellow', 10));
                bullets.push(new Bullet(this.x + 20, this.y + 30, 8, 0, 'yellow', 10));
                bullets.push(new Bullet(this.x + 20, this.y + 30, 8, 2, 'yellow', 10));
            } else {
                bullets.push(new Bullet(this.x + 20, this.y + 30, 8, 0, 'yellow', 10));
            }
            this.lastFire = now;
        }
    }
}

// 子彈類別
class Bullet {
    constructor(x, y, dy, dx, color, power) {
        this.x = x; this.y = y; this.dy = dy; this.dx = dx;
        this.color = color; this.power = power; this.r = 4;
    }
    update() { this.y += this.dy; this.x += this.dx; }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
        ctx.fillStyle = this.color;
        ctx.fill();
    }
}

// 魔王類別
class Boss {
    constructor() {
        this.w = 120; this.h = 80;
        this.x = canvas.width/2 - 60;
        this.y = canvas.height - 120;
        this.hp = 1000; this.maxHp = 1000;
        this.speed = 2;
        this.lastAttack = 0;
    }
    update() {
        this.x += this.speed;
        if (this.x <= 0 || this.x + this.w >= canvas.width) this.speed *= -1;
        
        // 魔王攻擊邏輯
        const now = Date.now();
        if (now - this.lastAttack > 2000) {
            this.attack();
            this.lastAttack = now;
        }
    }
    attack() {
        // 向上發射散彈
        for(let i=-3; i<=3; i++) {
            enemyBullets.push(new Bullet(this.x + this.w/2, this.y, -4, i, 'cyan', 15));
        }
    }
    draw() {
        ctx.fillStyle = '#708090';
        ctx.beginPath(); // 畫一個像鯊魚的三角形/橢圓
        ctx.ellipse(this.x + this.w/2, this.y + this.h/2, this.w/2, this.h/2, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = 'red'; // 眼睛
        ctx.fillRect(this.x + 20, this.y + 30, 10, 10);
    }
}

// 道具類別
class Item {
    constructor(x, y) {
        this.x = x; this.y = y; this.w = 25; this.h = 25;
        const types = ['heal', 'fireRate', 'triple'];
        this.type = types[Math.floor(Math.random() * types.length)];
        this.dy = 2;
    }
    draw() {
        ctx.fillStyle = this.type === 'heal' ? 'red' : (this.type === 'fireRate' ? 'gold' : 'lime');
        ctx.fillRect(this.x, this.y, this.w, this.h);
        ctx.fillStyle = 'white';
        ctx.font = '12px Arial';
        ctx.fillText(this.type[0].toUpperCase(), this.x + 8, this.y + 18);
    }
    update() { this.y += this.dy; }
}

// 小兵類別 (小魚)
class Minion {
    constructor() {
        this.x = -30;
        this.y = canvas.height * 0.6 + Math.random() * 100;
        this.w = 30; this.h = 20;
        this.speed = 2 + Math.random() * 3;
    }
    update() { this.x += this.speed; }
    draw() {
        ctx.fillStyle = 'orange';
        ctx.fillRect(this.x, this.y, this.w, this.h);
    }
}

// 坦克
class Tank {
    constructor(x) {
        this.x = x; this.y = canvas.height * 0.6 - 30;
        this.w = 50; this.h = 30;
        this.hp = 40;
        this.speed = 1;
    }
    update() {
        this.x += this.speed;
        if (this.x > canvas.width) this.x = -50;
        if (Math.random() > 0.99) enemyBullets.push(new Bullet(this.x+25, this.y, -5, 0, 'black', 5));
    }
    draw() {
        ctx.fillStyle = '#556B2F';
        ctx.fillRect(this.x, this.y, this.w, this.h);
    }
}

// 初始化
const p1 = new Plane(50, 100, 'red', 1);
const p2 = new Plane(150, 100, 'blue', 2);
const boss = new Boss();
for(let i=0; i<5; i++) tanks.push(new Tank(Math.random()*canvas.width));

// 監聽
canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (let i = 0; i < e.touches.length; i++) {
        let t = e.touches[i];
        if (t.clientX < canvas.width / 2) p1.update(t.clientX, t.clientY);
        else p2.update(t.clientX, t.clientY);
    }
}, {passive: false});

function spawnMinion() {
    if (!gameOver && Math.random() > 0.97) minions.push(new Minion());
}

function checkCollision(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update() {
    if (gameOver) return;

    p1.shoot(); p2.shoot();
    boss.update();
    spawnMinion();

    // 處理玩家子彈
    bullets.forEach((b, bi) => {
        b.update();
        if (b.y > canvas.height) bullets.splice(bi, 1);
        
        // 中坦克
        tanks.forEach(t => {
            if (checkCollision({x:b.x, y:b.y, w:5, h:5}, t)) {
                t.hp -= b.power;
                bullets.splice(bi, 1);
                if (t.hp <= 0) {
                    score++;
                    t.hp = 40; t.x = -50; // 重生坦克
                    if (Math.random() > 0.5) items.push(new Item(t.x, t.y));
                }
            }
        });

        // 中小兵
        minions.forEach((m, mi) => {
            if (checkCollision({x:b.x, y:b.y, w:5, h:5}, m)) {
                minions.splice(mi, 1);
                bullets.splice(bi, 1);
                score++;
                if (Math.random() > 0.7) items.push(new Item(m.x, m.y));
            }
        });

        // 中魔王
        if (checkCollision({x:b.x, y:b.y, w:5, h:5}, boss)) {
            boss.hp -= b.power;
            bullets.splice(bi, 1);
        }
    });

    // 處理敵人子彈
    enemyBullets.forEach((eb, ebi) => {
        eb.update();
        [p1, p2].forEach(p => {
            if (p.hp > 0 && checkCollision({x:eb.x, y:eb.y, w:5, h:5}, p)) {
                p.hp -= eb.power;
                enemyBullets.splice(ebi, 1);
            }
        });
        if (eb.y < 0) enemyBullets.splice(ebi, 1);
    });

    // 處理道具
    items.forEach((it, iti) => {
        it.update();
        [p1, p2].forEach(p => {
            if (p.hp > 0 && checkCollision(it, p)) {
                if (it.type === 'heal') p.hp = Math.min(p.maxHp, p.hp + 30);
                if (it.type === 'fireRate') { p.fireRate = 200; p.buffTimer = 300; }
                if (it.type === 'triple') { p.weaponType = 'triple'; p.buffTimer = 300; }
                items.splice(iti, 1);
            }
        });
    });

    // 處理小兵移動
    minions.forEach((m, mi) => {
        m.update();
        if (m.x > canvas.width) minions.splice(mi, 1);
    });
    
    tanks.forEach(t => t.update());

    // UI 更新
    document.getElementById('p1-hp-bar').style.width = Math.max(0, p1.hp) + '%';
    document.getElementById('p2-hp-bar').style.width = Math.max(0, p2.hp) + '%';
    document.getElementById('boss-hp-bar').style.width = (Math.max(0, boss.hp)/10) + '%';
    document.getElementById('score').innerText = score;

    if (boss.hp <= 0) { gameOver = true; finish("勝利！大海恢復了和平！"); }
    if (p1.hp <= 0 && p2.hp <= 0) { gameOver = true; finish("失敗！戰機全數墜毀..."); }
}

function finish(txt) {
    document.getElementById('msg').style.display = 'block';
    document.getElementById('msg').innerHTML = txt + "<br><span style='font-size:16px'>點擊重新開始</span>";
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 繪製水平線
    ctx.strokeStyle = 'white';
    ctx.beginPath(); ctx.moveTo(0, canvas.height * 0.6); ctx.lineTo(canvas.width, canvas.height * 0.6); ctx.stroke();

    p1.draw(); p2.draw();
    boss.draw();
    tanks.forEach(t => t.draw());
    minions.forEach(m => m.draw());
    bullets.forEach(b => b.draw());
    enemyBullets.forEach(eb => eb.draw());
    items.forEach(it => it.draw());

    update();
    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
